<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MM0 · MONOMOD</title>
<style>
  body { background:#0a0a0a; color:#d0d0d0; font-family:monospace;
         padding:20px; max-width:900px; margin:0 auto; }
  h1 { color:#7fff7f; font-size:16px; letter-spacing:2px; }
  #status { color:#ffaa00; font-size:13px; margin-bottom:16px; }
  .row { margin:8px 0; }
  input, button { background:#1a1a1a; color:#d0d0d0; border:1px solid #333;
                  font-family:monospace; padding:6px 10px; font-size:13px; }
  input { width: 420px; }
  button { cursor:pointer; }
  button:hover { border-color:#7fff7f; color:#7fff7f; }
  #out { background:#111; border:1px solid #222; padding:12px;
         white-space:pre-wrap; font-size:12px; margin-top:16px;
         min-height:200px; }
  .ok { color:#7fff7f; }
  .err { color:#ff5555; }
</style>
</head>
<body>

<h1>MM0 · ИДЕНТИФИКАТОР MONOMOD</h1>
<div id="status">загрузка python…</div>

<div class="row">
  <button onclick="py_new()">new</button>
  <button onclick="py_index()">index</button>
</div>

<div class="row">
  <input id="tok" placeholder="MONOMOD::MMMMMMMMMMMMMMMMMMMMMMMMMM">
  <button onclick="py_enter()">enter</button>
  <button onclick="py_show()">show</button>
  <button onclick="py_check()">check</button>
</div>

<div id="out"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
let pyodide = null;
const out = document.getElementById('out');
const status = document.getElementById('status');

function log(s, cls) {
  const span = cls ? `<span class="${cls}">${s}</span>` : s;
  out.innerHTML += span + "\n";
}
function clear() { out.innerHTML = ""; }

async function boot() {
  pyodide = await loadPyodide();
  await pyodide.runPythonAsync(`
import json, os
from datetime import datetime, timezone

PREFIX = "MONOMOD::"
ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
DIM = 26
TOKEN_LEN = len(PREFIX) + DIM
CENTER = "M"

# Хранилище в памяти процесса Python
STORE = {}       # token -> dict (состояние)
INDEX = []       # список токенов

def parse(token):
    if not isinstance(token, str):
        raise ValueError("токен не строка")
    if len(token) != TOKEN_LEN:
        raise ValueError(f"длина {len(token)}, ожидается {TOKEN_LEN}")
    if not token.startswith(PREFIX):
        raise ValueError("нет префикса MONOMOD::")
    body = token[len(PREFIX):]
    coords = []
    for i, ch in enumerate(body):
        if ch not in ALPHABET:
            raise ValueError(f"координата {i}: '{ch}' вне A-Z")
        coords.append(ALPHABET.index(ch))
    return coords

def format_token(coords):
    if len(coords) != DIM:
        raise ValueError(f"координат {len(coords)}, ожидается {DIM}")
    for i, v in enumerate(coords):
        if not (isinstance(v, int) and 0 <= v < 26):
            raise ValueError(f"координата {i}: {v} вне 0..25")
    return PREFIX + "".join(ALPHABET[v] for v in coords)

def center_token():
    return format_token([12]*DIM)

def new_state(token):
    return {
        "token": token,
        "created": datetime.now(timezone.utc).isoformat(),
        "center": CENTER,
        "axes": parse(token),
        "mode": "MONOMOD",
        "baseline": {"noise": 0.02, "coherence": 0.985},
        "window": 100,
        "history": [],
    }

def enter(token):
    parse(token)
    if token not in STORE:
        STORE[token] = new_state(token)
        INDEX.append(token)
        return {"created": True, "state": STORE[token]}
    return {"created": False, "state": STORE[token]}

def load(token):
    parse(token)
    return STORE.get(token, new_state(token))
`);

  // Подтянуть сохранённое из localStorage
  const saved = localStorage.getItem('mm0_store');
  if (saved) {
    pyodide.globals.set('_saved', saved);
    await pyodide.runPythonAsync(`
import json as _json
_s = _json.loads(_saved)
STORE.clear()
INDEX.clear()
for t, st in _s.get('store', {}).items():
    STORE[t] = st
INDEX.extend(_s.get('index', []))
`);
  }

  status.innerHTML = '<span class="ok">python готов</span>';
}

function persist() {
  pyodide.runPython(`
import json as _json
_dump = _json.dumps({"store": STORE, "index": INDEX})
`);
  const dump = pyodide.globals.get('_dump');
  localStorage.setItem('mm0_store', dump);
}

function py_new() {
  clear();
  const t = pyodide.runPython('center_token()');
  log(t, 'ok');
  persist();
}

function py_index() {
  clear();
  const idx = pyodide.runPython('list(INDEX)').toJs();
  if (idx.length === 0) { log('(пусто)'); return; }
  idx.forEach(t => log(t));
}

function py_enter() {
  clear();
  const tok = document.getElementById('tok').value.trim();
  try {
    pyodide.globals.set('_tok', tok);
    pyodide.runPython(`
_res = enter(_tok)
`);
    const created = pyodide.runPython('_res["created"]');
    const st = pyodide.runPython('_res["state"]');
    const stStr = pyodide.runPython('import json as _j; _j.dumps(_res["state"], ensure_ascii=False, indent=2)');
    log(created ? 'НОВЫЙ ТОКЕН — заход выполнен' : 'токен найден — заход выполнен', 'ok');
    log(stStr);
    persist();
  } catch (e) {
    log('ошибка: ' + e.message, 'err');
  }
}

function py_show() {
  clear();
  const tok = document.getElementById('tok').value.trim();
  try {
    pyodide.globals.set('_tok', tok);
    pyodide.runPython('_st = load(_tok)');
    const s = pyodide.runPython('import json as _j; _j.dumps(_st, ensure_ascii=False, indent=2)');
    log(s);
  } catch (e) {
    log('ошибка: ' + e.message, 'err');
  }
}

function py_check() {
  clear();
  const tok = document.getElementById('tok').value.trim();
  try {
    pyodide.globals.set('_tok', tok);
    pyodide.runPython('_coords = parse(_tok)');
    const coords = pyodide.runPython('_coords').toJs();
    log('валиден', 'ok');
    log('координаты: [' + coords.join(', ') + ']');
  } catch (e) {
    log('невалиден: ' + e.message, 'err');
  }
}

boot();
</script>

</body>
</html>
